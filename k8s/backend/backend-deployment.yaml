apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stroke-mlops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      securityContext:
        fsGroup: 101

      # Initialise automatiquement les permissions du stockage
      initContainers:
        - name: fix-storage-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown -R 100:101 /app/storage
              chmod -R 775 /app/storage
          volumeMounts:
            - name: backend-storage
              mountPath: /app/storage

      containers:
        - name: backend
          image: hazem231/stroke-backend:1.3
          imagePullPolicy: Always

          ports:
            - containerPort: 8082

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: stroke-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: stroke-config
                  key: MYSQL_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stroke-secret
                  key: MYSQL_PASSWORD

            - name: APP_FASTAPI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: stroke-config
                  key: APP_FASTAPI_BASE_URL

          volumeMounts:
            - name: backend-storage
              mountPath: /app/storage

          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: backend-storage-pvc