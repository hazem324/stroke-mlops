apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: stroke-mlops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi

    spec:
      containers:
        - name: fastapi
          image: hazem231/stroke-fastapi:1.2
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          # Load FastAPI configuration from ConfigMap
          envFrom:
            - configMapRef:
                name: stroke-config

          # readinessProbe:
