apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stroke-mlops
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: hazem231/stroke-frontend:1.1

          imagePullPolicy: Always

          ports:
            - containerPort: 80