apiVersion: v1
kind: ConfigMap
metadata:
  name: stroke-config
  namespace: stroke-mlops

data:
  # MySQL
  MYSQL_DATABASE: "stroke_mlops"
  MYSQL_USER: "stroke_user"

  # Spring Boot Backend
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/stroke_mlops"

  # FastAPI URL used by Backend
  APP_FASTAPI_BASE_URL: "http://fastapi:8000"

  # FastAPI Application
  APP_NAME: "Stroke MRI Segmentation API"
  APP_VERSION: "1.0.0"
  APP_DESCRIPTION: "REST API for ischemic stroke lesion segmentation from DWI MRI"

  HOST: "0.0.0.0"
  PORT: "8000"

  ENVIRONMENT: "development"
  DEBUG: "true"

  # ML Model
  MODEL_NAME: "unet3d-dwi"
  MODEL_PATH: "models/unet3d_dwi_best.pth"

  DEVICE: "cpu"
  PREDICTION_THRESHOLD: "0.5"

  # MRI preprocessing
  TARGET_WIDTH: "128"
  TARGET_HEIGHT: "128"
  TARGET_DEPTH: "64"

  # Upload configuration
  MAX_UPLOAD_SIZE_MB: "100"