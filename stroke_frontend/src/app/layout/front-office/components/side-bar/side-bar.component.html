<aside class="sidebar">

  <!-- =========================
       LOGO / MARQUE
       ========================= -->

  <div class="sidebar-brand">

    <img
      src="/images/neurovia-logo.png"
      alt="Logo Neurovia">

    <div class="brand-text">

  </div>

    <a

      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <rect

          x="14"

        <rect

          y="14"
          width="7"
          height="7"
          rx="1">

    <a
      routerLink="/dashboard/patient"
      routerLinkActive="active"
      class="nav-link">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <circle
          cx="9"
          cy="8"

        <path
          d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6">
        </path>

          cy="8.5"

    <!-- Nouvelle analyse -->

      routerLink="/dashboard/analysis/new-analysis"
      routerLinkActive="active"
      class="nav-link">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"

    <a
      routerLink="/analysis/history"
      routerLinkActive="active"

      <svg
        viewBox="0 0 24 24"
        fill="none"

         ========================= -->

      routerLinkActive="active"
      class="nav-link">

      <svg
        viewBox="0 0 24 24"

      </span>

       DÉCONNEXION

  <div class="sidebar-footer">

    <button
      type="button"

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path
          d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4">

        <path
          d="M16 17l5-5-5-5">
