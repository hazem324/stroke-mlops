<header class="topbar">

  <!-- Titre de la page -->
  <div class="topbar-page">

    <div class="topbar-title">
      {{ pageTitle }}
    </div>

    <div class="topbar-crumb">
      {{ pageSubtitle }}
    </div>

  </div>


  <!-- Partie droite -->
  <div class="topbar-right">

    <button
      type="button"
      class="user-chip">

      <div class="avatar">
        DR
      </div>

      <div class="user-info">

        <div class="u-name">
          Dr. Amine Rekik
        </div>

        <div class="u-role">
          Radiologue
        </div>

      </div>

      <svg
        class="user-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M6 9l6 6 6-6"></path>

      </svg>

    </button>

  </div>

</header>
