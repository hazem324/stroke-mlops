<header class="topbar">

  <!-- =========================
       TITRE DE LA PAGE
       ========================= -->

  <div class="topbar-page">

    <div class="topbar-title">
      Patients
    </div>

    <div class="topbar-crumb">
      Gérer les dossiers patients
    </div>

  </div>


  <!-- =========================
       PARTIE DROITE
       ========================= -->

  <div class="topbar-right">


    <!-- Recherche globale -->

    <div class="topbar-search">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <circle
          cx="11"
          cy="11"
          r="7">
        </circle>

        <path
          d="M16 16l4 4">
        </path>

      </svg>

      <span>
        Rechercher un patient, une étude...
      </span>

    </div>


    <!-- Notifications -->

    <button
      type="button"
      class="icon-btn"
      aria-label="Notifications">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round">

        <path
          d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9">
        </path>

        <path
          d="M10 21h4">
        </path>

      </svg>

      <span class="notification-dot"></span>

    </button>


    <!-- =========================
         UTILISATEUR
         ========================= -->

    <button
      type="button"
      class="user-chip">

      <div class="avatar">
        DR
      </div>


      <div class="user-info">

        <div class="u-name">
          Dr. Amine Rekik
        </div>

        <div class="u-role">
          Radiologue
        </div>

      </div>


      <!-- Flèche -->

      <svg
        class="user-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path
          d="M6 9l6 6 6-6">
        </path>

      </svg>

    </button>

  </div>

</header>
