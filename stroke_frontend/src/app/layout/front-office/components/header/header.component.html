<header class="topbar">

  <!-- Titre de la page -->
  <div class="topbar-page">

    <div class="topbar-title">
      {{ pageTitle }}
    </div>

    <div class="topbar-crumb">
      {{ pageSubtitle }}
    </div>

  </div>


  <!-- Partie droite -->
  <div class="topbar-right">

    <button
      type="button"
      class="user-chip">

      <!-- Avatar -->
      <div class="avatar">
        {{ getUserInitials() }}
      </div>

      <!-- Informations utilisateur -->
      <div class="user-info">

        <div class="u-name">
          {{ getUserFullName() }}
        </div>

        <div class="u-role">
          {{ getUserRole() }}
        </div>

      </div>

    </button>

  </div>

</header>
