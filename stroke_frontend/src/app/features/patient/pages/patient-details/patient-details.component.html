<div class="main">

  <!-- =========================
       HEADER
       ========================= -->

  <div class="page-head">

    <div>
      <h1>John Doe</h1>

      <p class="lede">
        Patient P001
      </p>
    </div>

    <div class="page-actions">

      <button
        type="button"
        class="btn btn-secondary">
        Edit patient
      </button>

      <button
        type="button"
        class="btn btn-primary">
        New Analysis
      </button>

    </div>

  </div>


  <!-- =========================
       PATIENT INFORMATION
       ========================= -->

  <div class="patient-info-grid">

    <!-- Patient ID -->

    <div class="info-card">

      <div class="info-label">
        Patient ID
      </div>

      <div class="info-value mono">
        P001
      </div>

    </div>


    <!-- Age -->

    <div class="info-card">

      <div class="info-label">
        Age
      </div>

      <div class="info-value-large">

        58

        <span class="unit">
          years
        </span>

      </div>

    </div>


    <!-- Sex -->

    <div class="info-card">

      <div class="info-label">
        Sex
      </div>

      <div class="info-value">
        Male
      </div>

    </div>


    <!-- Date of birth -->

    <div class="info-card">

      <div class="info-label">
        Date of birth
      </div>

      <div class="info-value">
        14/03/1968
      </div>

    </div>


    <!-- Weight -->

    <div class="info-card">

      <div class="info-label">
        Weight
      </div>

      <div class="info-value">
        78 kg
      </div>

    </div>


    <!-- Studies -->

    <div class="info-card">

      <div class="info-label">
        Studies
      </div>

      <div class="info-value-large">
        3
      </div>

    </div>

  </div>


  <!-- =========================
       STUDIES
       ========================= -->

  <div class="studies-card">

    <!-- Studies header -->

    <div class="card-head">

      <div>

        <h3>
          Studies
        </h3>

        <span class="hint">
          MRI studies for this patient
        </span>

      </div>

      <button
        type="button"
        class="btn btn-primary btn-sm">

        + New Study

      </button>

    </div>


    <!-- Studies table -->

    <div class="table-wrap">

      <table class="data">

        <thead>

          <tr>

            <th>
              Study ID
            </th>

            <th>
              Date
            </th>

            <th>
              Modality
            </th>

            <th>
              Status
            </th>

            <th class="action-column">
              Action
            </th>

          </tr>

        </thead>


        <tbody>

          <!-- =========================
               STUDY 1
               ========================= -->

          <tr>

            <td>

              <span class="id-tag">
                S001
              </span>

            </td>

            <td>
              18/08/2026
            </td>

            <td>
              DWI
            </td>

            <td>

              <span class="badge badge-completed">

                <span class="dot"></span>

                Completed

              </span>

            </td>

            <td class="action-column">

              <button
                type="button"
                class="btn btn-secondary btn-sm">

                View

              </button>

            </td>

          </tr>


          <!-- =========================
               STUDY 2
               ========================= -->

          <tr>

            <td>

              <span class="id-tag">
                S002
              </span>

            </td>

            <td>
              12/08/2026
            </td>

            <td>
              DWI
            </td>

            <td>

              <span class="badge badge-processing">

                <span class="dot"></span>

                Processing

              </span>

            </td>

            <td class="action-column">

              <button
                type="button"
                class="btn btn-secondary btn-sm">

                View

              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
