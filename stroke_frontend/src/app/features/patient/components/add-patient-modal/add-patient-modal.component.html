<div class="modal-backdrop">

  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="add-patient-title">

    <!-- =========================
         HEADER
         ========================= -->

    <div class="modal-head">

      <h3 id="add-patient-title">
        Add new patient
      </h3>

      <button
        type="button"
        class="close-x"
        aria-label="Close"
        (click)="closeModal()">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <path d="M18 6 6 18"></path>
          <path d="M6 6l12 12"></path>

        </svg>

      </button>

    </div>


    <!-- =========================
         BODY
         ========================= -->

    <div class="modal-body">

      <!-- Patient code -->

      <div class="field">

        <label
          class="field-label"
          for="patientCode">

          Patient code

        </label>

        <input
          id="patientCode"
          type="text"
          class="input mono"
          value="P125"
          readonly>

      </div>


      <!-- First name / Last name -->

      <div class="form-grid">

        <div class="field">

          <label
            class="field-label"
            for="firstName">

            First name

          </label>

          <input
            id="firstName"
            type="text"
            class="input"
            placeholder="e.g. Ahmed">

        </div>


        <div class="field">

          <label
            class="field-label"
            for="lastName">

            Last name

          </label>

          <input
            id="lastName"
            type="text"
            class="input"
            placeholder="e.g. Ben Ali">

        </div>

      </div>


      <!-- Date of birth / Sex -->

      <div class="form-grid">

        <div class="field">

          <label
            class="field-label"
            for="dateOfBirth">

            Date of birth

          </label>

          <input
            id="dateOfBirth"
            type="date"
            class="input">

        </div>


        <div class="field">

          <label
            class="field-label"
            for="sex">

            Sex

          </label>

          <select
            id="sex"
            class="input">

            <option value="MALE">
              Male
            </option>

            <option value="FEMALE">
              Female
            </option>

          </select>

        </div>

      </div>


      <!-- Age / Weight -->

      <div class="form-grid">

        <div class="field">

          <label
            class="field-label"
            for="age">

            Age

          </label>

          <input
            id="age"
            type="number"
            class="input"
            placeholder="e.g. 47">

        </div>


        <div class="field">

          <label
            class="field-label"
            for="weight">

            Weight

          </label>

          <input
            id="weight"
            type="number"
            step="0.1"
            class="input"
            placeholder="e.g. 75.5">

        </div>

      </div>

    </div>


    <!-- =========================
         FOOTER
         ========================= -->

    <div class="modal-foot">

      <button
        type="button"
        class="btn btn-secondary"
        (click)="closeModal()">

        Cancel

      </button>

      <button
        type="button"
        class="btn btn-primary"
        (click)="savePatient()">

        Save patient

      </button>

    </div>

  </div>

</div>
