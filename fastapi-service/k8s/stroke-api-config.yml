apiVersion: v1
kind: ConfigMap
metadata:
  name: stroke-api-config
  namespace: stroke-ml
data:
  APP_NAME: "Stroke MRI Segmentation API"
  APP_VERSION: "1.0.0"
  APP_DESCRIPTION: "REST API for ischemic stroke lesion segmentation from DWI MRI"

  HOST: "0.0.0.0"
  PORT: "8000"

  ENVIRONMENT: "development"
  DEBUG: "true"

  MODEL_NAME: "unet3d-dwi"
  MODEL_PATH: "models/unet3d_dwi_best.pth"

  DEVICE: "cpu"
  PREDICTION_THRESHOLD: "0.5"

  TARGET_WIDTH: "128"
  TARGET_HEIGHT: "128"
  TARGET_DEPTH: "64"

  MAX_UPLOAD_SIZE_MB: "100"