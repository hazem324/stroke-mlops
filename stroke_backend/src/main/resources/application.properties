spring.application.name=stroke_backend

spring.datasource.url=jdbc:mysql://localhost:3306/stroke_mlops
spring.datasource.username=stroke_user
spring.datasource.password=stroke_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8082
server.servlet.context-path=/stroke_ml

jwt.secret=stroke-mlops-secret-key-2026-this-must-be-long-enough-for-hs256
jwt.expiration=3600000


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# FILE STORAGE
app.storage.base-path=/app/storage

# FILE UPLOAD
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# =========================================
# FASTAPI
# =========================================

app.fastapi.base-url=http://localhost:8000

app.fastapi.predict-endpoint=/predict/

app.storage.location=/home/hazem/stroke-mlops/stroke_backend/storage/