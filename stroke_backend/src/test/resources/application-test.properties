spring.datasource.url=jdbc:h2:mem:stroke_mlops;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.h2.console.enabled=true

jwt.secret=test-secret-key-that-is-long-enough-for-hs384
jwt.expiration=3600000

app.fastapi.base-url=http://localhost:8000
app.fastapi.predict-endpoint=/predict/
app.storage.base-path=target/test-storage

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
